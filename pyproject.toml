[project]
name = "parch"
version = "0.1.0"
description = "Yearly planner PDFs for e-ink devices (Python port of kudrykv/LYP via Typst)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
  { name = "PDF Planner Project" }
]
dependencies = [
    "pydantic>=2.13.4",
    "questionary",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
parch = "parch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parch"]


[tool.uv]
package = true

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
