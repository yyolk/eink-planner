[project]
name = "eink-planner"
version = "0.1.0"
description = "Python port of kudrykv/LYP: generate yearly e-ink planner PDFs via Typst"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
  { name = "PDF Planner Project" }
]
dependencies = [
  "ckdl>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lyp = "eink_planner.cli:main"
eink-planner = "eink_planner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eink_planner"]

[tool.hatch.build.targets.wheel.force-include]
"src/eink_planner/assets/kdl.sublime-syntax" = "eink_planner/assets/kdl.sublime-syntax"
"src/eink_planner/assets/eink-luma.tmTheme" = "eink_planner/assets/eink-luma.tmTheme"

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
