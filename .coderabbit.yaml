# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  request_changes_workflow: true
  # review_progress check runs are not appearing on this repo.
  # commit_status only posts the GitHub commit status (context: CodeRabbit)
  # when review_progress is off — that is the surface you can require.
  review_progress: false
  commit_status: true
  fail_commit_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - master
