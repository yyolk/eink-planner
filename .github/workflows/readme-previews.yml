name: README preview SVGs

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "configs/158x210-mos-left.toml"

concurrency:
  group: readme-previews
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --group dev
      - name: Regenerate 158×210 sample SVGs
        run: uv run python scripts/regen_readme_samples.py
      - name: Push only when SVGs changed
        run: |
          git add docs/samples/158x210-mos-left
          if git diff --cached --quiet; then
            echo "preview SVGs unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate 158×210 README preview SVGs."
          git push
