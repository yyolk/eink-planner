name: README preview SVGs

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "src/parch/data/configs/158x210.toml"

concurrency:
  group: readme-previews
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  regen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.7"
      - run: uv sync --group dev
      - name: Regenerate 158×210 sample SVGs
        run: uv run parch proof 158x210 --samples
      - name: Open a PR when SVGs changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add docs/samples/158x210
          if git diff --cached --quiet; then
            echo "preview SVGs unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # actions/checkout is a shallow master-only clone. Bare
          # --force-with-lease with no remote-tracking ref treats the bot
          # branch as "must not exist" and rejects with "stale info".
          # Fetch the tip (ok if missing) and pass that ref as the lease
          # so the check does not depend on remote.origin.fetch mapping.
          git switch -C chore/readme-preview-svgs
          git commit -m "Regenerate 158×210 README preview SVGs."
          if git fetch --depth=1 origin \
               +refs/heads/chore/readme-preview-svgs:refs/remotes/origin/chore/readme-preview-svgs; then
            git push --force-with-lease=refs/heads/chore/readme-preview-svgs:refs/remotes/origin/chore/readme-preview-svgs \
              origin chore/readme-preview-svgs
          else
            echo "no origin/chore/readme-preview-svgs yet"
            git push origin chore/readme-preview-svgs
          fi
          existing="$(gh pr list --head chore/readme-preview-svgs --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "updated PR #$existing"
            exit 0
          fi
          gh pr create --base master --head chore/readme-preview-svgs \
            --title "Regenerate 158×210 README preview SVGs" \
            --body "$(cat <<'EOF'
          Bot-generated Typst preview SVGs for the README. Merge after CI passes.

          This PR is opened instead of pushing to master so the required \`test\` check can run.
          EOF
          )"
