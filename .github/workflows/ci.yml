name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.7"
          cache-suffix: cli
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: uv sync --group dev
      - run: uv run pytest
      - name: Generate Nomad PDF
        run: |
          uv run parch press supernote-nomad -w out/nomad
          test -s out/nomad/index.pdf

  test-typst-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.7"
          cache-suffix: typst-native
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: uv sync --extra typst-native --group dev
      - name: Test with in-process typst
        env:
          PARCH_TYPST: py
        run: uv run pytest -m "not slow"
      - name: Press Nomad with typst-py
        env:
          PARCH_TYPST: py
        run: |
          uv run parch press supernote-nomad -w out/nomad-py
          test -s out/nomad-py/index.pdf
      - name: Proof one MOS-left page with typst-py
        env:
          PARCH_TYPST: py
        run: |
          uv run parch proof 158x210 --pages 1 -w out/proof-py
          test -s out/proof-py/preview-1.svg

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.7"
          cache-suffix: pages
      - run: uv sync --group dev
      - name: Build specimen catalog
        run: |
          mapfile -t ids < <(uv run python -c "from parch.device_frame import FRAME_DEVICE_IDS; print('\n'.join(sorted(FRAME_DEVICE_IDS)))")
          for id in "${ids[@]}"; do
            uv run parch specimen "$id" -w out
          done
          test -s out/specimens/index.html
          test -s out/specimens/158x210/cover.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out/specimens
      - id: deploy
        uses: actions/deploy-pages@v4
