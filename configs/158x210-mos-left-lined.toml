# 158×210 MOS-left lined
# 158×210 MOS-left sibling with house scratch pad lined.
# Daily on-page notes stay dotted; other notes areas inherit lined from style.
# Original LYP gist MOS (Months on the Side) layout at 158 × 210 mm
# Name is the physical MOS strip side (nav left), not which hand you write with.
# MOS-left is the right-handed writing layout (nav opposite the writing hand).

sections = [
  "cover",
  "annual",
  "quarterly",
  "monthly",
  "weekly",
  "daily",
  "daily_notes",
  "colophon",
]

[device]
name = "158x210-mos-left-lined"
width = "158mm"
height = "210mm"
ppi = 300

[calendar]
year = 2026
week_starts = "Monday"

[style]
scratch_pad = "lined"

[style.stroke]
regular = "0.4pt"
thick = "0.8pt"

[style.type]
body = "10pt"
h1 = "10mm"

[style.margin]
top = "10mm"
bottom = "0mm"
left = "0mm"
right = "5mm"

[style.gutter]
column = "10pt"

# layout.name = "mos" → Months on the Side (vertical side menu navigation)
# side_menu left|right is the physical side of the MOS strip
[layout]
name = "mos"
side_menu = "left"
side_menu_width = "10mm"
reverse_months_quarters = true
menu_rotate = "270deg"
column_gutter = "2mm"
row_gutter = "2mm"

[section.cover]
title = "2026"
font_size = "48pt"

[section.annual]
show_month_name = true
row_gutter = "5pt"

[section.quarterly]
months_column = "left"
show_month_name = true

[section.monthly]
week_placement = "left"
week_label_rotation = "90deg"
daily_cell_height = "2.5cm"

[section.weekly]
column_gutter = "5pt"

[section.daily]
columns = ["3fr", "5fr"]
item_spacing = "5mm"

[section.daily.left.schedule]
hour_from = 8
hour_to = 20
time_format = "%k"
trailing_half_hour = true

[section.daily.left.little_calendar]
week_placement = "left"
inset = "5pt"

[section.daily.right.priorities]
count = 5

[section.daily.right.notes]
pattern = "dotted"
title_height = "5mm"

[section.daily_notes]
pages = 2
