# SuperNote Nomad (A6 X2) — default device
# 1404×1872 @ 300 PPI → 336.96×449.28 pt = 118.87×158.5 mm (3:4)
# MOS leftie layout (side menu left, reverse months/quarters, Monday start).
# Strokes, type, and gutters are scaled down from the 158×210 gist so the
# planner still fits the smaller glass.

version: "0.2"

template: mos
debug: false

device: supernote-nomad

document:
  layout:
    dimensions:
      width: 118.87mm
      height: 158.5mm

    margin:
      top: 8mm
      bottom: 0mm
      left: 0mm
      right: 4mm

  text:
    size: 8pt
    h1: 8mm

planner:
  params:
    regular_stroke: 0.3pt
    thick_stroke: 0.6pt
    regular_height: 4mm
    scratch_pad: dotted
    link_padding: 6pt
    regular_column_gutter: 8pt

    start_date: "2026-01-01"
    end_date: "2026-12-31"
    weekday_start: Monday

    little_calendar:
      week_placement: left
      inset: 3pt

    mos_layout:
      side_menu_position: left
      side_menu_width: 8mm
      column_gutter: 1.5mm
      row_gutter: 1.5mm
      menu_rotate: 270deg
      reverse_months_quarters: true
      reverse_months_quarters_items: true

    heading:
      height: 8mm
      align: horizon

  sections:
    - name: cover
      class: cover_plain
      enabled: true
      params:
        name: "2026\n\nPlanner"
        font_size: 36pt

    - name: annual
      class: annual
      enabled: true
      params:
        little_calendar:
          show_month_name: true
        row_gutter: 4pt

    - name: quarterly
      class: quarterly
      enabled: true
      params:
        months_column: left
        little_calendar:
          show_month_name: true

    - name: monthly
      class: monthly
      enabled: true
      params:
        month_params:
          week_placement: left
          week_label_rotation: 90deg
          daily_cell_height: 16mm

    - name: weekly
      class: weekly
      enabled: true
      params:
        column_gutter: 4pt

    - name: daily
      class: daily
      enabled: true
      params:
        columns_width: (3fr, 5fr)
        items_spacing: 4mm

        left_column:
          - name: schedule
            class: schedule
            enabled: true
            params:
              from: 8
              to: 20
              time_format: "%k"
              trailing_30_minutes: true

          - name: little calendar
            class: little_calendar
            enabled: true
            params:
              week_placement: left
              inset: 3pt

        right_column:
          - name: top priorities
            class: top_priorities
            enabled: true
            params:
              number: 5

          - name: notes
            class: notes
            enabled: true
            params:
              title_height: 4mm
              notes_height: 1fr
              pattern: dotted

    - name: daily_notes
      class: daily_notes
      enabled: true
      params:
        pages: 2
