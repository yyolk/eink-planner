# SuperNote Nomad (A6 X2)
# 1404×1872 @ 300 PPI → 118.87 × 158.5 mm
# MOS-left default; MOS-right sibling: configs/supernote-nomad-mos-right.toml

sections = [
  "cover",
  "annual",
  "quarterly",
  "monthly",
  "weekly",
  "daily",
  "daily_notes",
  "projects",
  "habits",
  "review",
]

[device]
name = "supernote-nomad"
width = "118.87mm"
height = "158.5mm"
ppi = 300

[calendar]
year = 2026
week_starts = "Monday"

[style.stroke]
regular = "0.3pt"
thick = "0.6pt"

[style.type]
body = "8pt"
h1 = "8mm"

[style.margin]
top = "8mm"
bottom = "0mm"
left = "0mm"
right = "4mm"

[style.gutter]
column = "8pt"

# layout.name = "mos" → Months on the Side (vertical side menu navigation)
# side_menu left|right is the physical side of the MOS strip
[layout]
name = "mos"
side_menu = "left"
side_menu_width = "8mm"
reverse_months_quarters = true
menu_rotate = "270deg"
column_gutter = "1.5mm"
row_gutter = "1.5mm"

[section.cover]
title = "2026\n\nPlanner"
font_size = "36pt"

[section.annual]
show_month_name = true
row_gutter = "4pt"

[section.quarterly]
months_column = "left"
show_month_name = true

[section.monthly]
week_placement = "left"
week_label_rotation = "90deg"
daily_cell_height = "16mm"

[section.weekly]
column_gutter = "4pt"

[section.daily]
columns = ["3fr", "5fr"]
item_spacing = "4mm"

[section.daily.left.schedule]
hour_from = 8
hour_to = 20
time_format = "%k"
trailing_half_hour = true

[section.daily.left.little_calendar]
week_placement = "left"
inset = "3pt"

[section.daily.right.priorities]
count = 5

[section.daily.right.notes]
pattern = "dotted"
title_height = "4mm"

[section.daily_notes]
pages = 2
pattern = "dotted"

[section.projects]
pages = 20
card_rows = 8

[section.habits]
habit_columns = 6
