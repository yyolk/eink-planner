# 158×210 MOS-right
# Original LYP gist MOS (Months on the Side) layout at 158 × 210 mm
# Name is the physical MOS strip side (nav right), not which hand you write with.
# MOS-right is the left-handed writing layout (nav opposite the writing hand).
# left/right under daily are physical column tracks.
# columns = ["5fr", "3fr"] so notes stay wide and schedule stays narrow.

sections = [
  "cover",
  "annual",
  "quarterly",
  "monthly",
  "weekly",
  "daily",
  "daily-notes",
]

[device]
name = "158x210-mos-right"
width = "158mm"
height = "210mm"
ppi = 300

[calendar]
year = 2026
week-starts = "Monday"

[style.stroke]
regular = "0.4pt"
thick = "0.8pt"

[style.type]
body = "10pt"
h1 = "10mm"

[style.margin]
top = "10mm"
bottom = "0mm"
left = "5mm"
right = "0mm"

[style.gutter]
column = "10pt"

# layout.name = "mos" → Months on the Side (vertical side menu navigation)
# side-menu left|right is the physical side of the MOS strip
[layout]
name = "mos"
side-menu = "right"
side-menu-width = "10mm"
reverse-months-quarters = true
menu-rotate = "270deg"
column-gutter = "2mm"
row-gutter = "2mm"

[section.cover]
title = "2026\n\nPlanner"
font-size = "48pt"

[section.annual]
show-month-name = true
row-gutter = "5pt"

[section.quarterly]
months-column = "right"
show-month-name = true

[section.monthly]
week-placement = "right"
week-label-rotation = "90deg"
daily-cell-height = "2.5cm"

[section.weekly]
column-gutter = "5pt"

[section.daily]
# column tracks are left-to-right, so notes stay 5fr and schedule stays 3fr
columns = ["5fr", "3fr"]
item-spacing = "5mm"

[section.daily.left.priorities]
count = 5

[section.daily.left.notes]
pattern = "dotted"
title-height = "5mm"

[section.daily.right.schedule]
from = 8
to = 20
time-format = "%k"
trailing-half-hour = true

[section.daily.right.little-calendar]
week-placement = "right"
inset = "5pt"

[section.daily-notes]
pages = 2
pattern = "dotted"
