# SuperNote Nomad (A6 X2)
# 1404×1872 @ 300 PPI → 118.87 × 158.5 mm
# MOS strip side is mos.side_menu (default left). Override with --hand.

sections = [
  "cover",
  "index",
  "annual",
  "quarterly",
  "monthly",
  "weekly",
  "daily",
  "daily_notes",
  "projects",
  "habits",
  "review",
  "tasks",
  "meetings",
  "colophon",
]

[device]
name = "supernote-nomad"
ppi = 300

[calendar]
year = 2026
week_starts = "Monday"

[style.stroke]
regular = "0.3pt"
thick = "0.6pt"

[style.type]
body = "8pt"
h1 = "8mm"

[style.gutter]
column = "8pt"

# [mos] → Months on the Side (vertical side menu navigation)
# side_menu left|right is the physical side of the MOS strip
[mos]
side_menu = "left"
reverse_months_quarters = true
menu_rotate = "270deg"
column_gutter = "1.5mm"
row_gutter = "1.5mm"

[section.cover]
title = "2026"
font_size = "36pt"

[section.annual]
show_month_name = true
row_gutter = "4pt"

[section.quarterly]
show_month_name = true

[section.monthly]
week_label_rotation = "90deg"
daily_cell_height = "16mm"

[section.weekly]
column_gutter = "4pt"

[section.daily]
item_spacing = "4mm"

[section.daily.left.schedule]
hour_from = 8
hour_to = 20
time_format = "%k"
trailing_half_hour = true

[section.daily.left.little_calendar]
inset = "3pt"

[section.daily.right.priorities]
count = 5

[section.daily.right.notes]
pattern = "dotted"
title_height = "4mm"

[section.daily_notes]
pages = 2
pattern = "dotted"

[section.projects]
pages = 16
card_rows = 5

[section.habits]
habit_columns = 4

[section.meetings]
index_pages = 1
