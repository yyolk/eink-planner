# SuperNote Nomad (A6 X2) MOS-right
# 1404×1872 @ 300 PPI → 118.87 × 158.5 mm
# MOS strip on the physical right; this is the left-handed writing layout
# (nav opposite the writing hand).
# left/right under daily are physical column tracks.
# columns = ["5fr", "3fr"] so notes stay wide and schedule stays narrow.

sections = [
  "cover",
  "index",
  "annual",
  "quarterly",
  "monthly",
  "weekly",
  "daily",
  "daily_notes",
  "habits",
  "review",
  "tasks",
  "meetings",
  "colophon",
]

[device]
name = "supernote-nomad-mos-right"
width = "118.87mm"
height = "158.5mm"
ppi = 300

[calendar]
year = 2026
week_starts = "Monday"

[style.stroke]
regular = "0.3pt"
thick = "0.6pt"

[style.type]
body = "8pt"
h1 = "8mm"

[style.margin]
top = "8mm"
bottom = "0mm"
left = "4mm"
right = "0mm"

[style.gutter]
column = "8pt"

# [mos] → Months on the Side (vertical side menu navigation)
# side_menu left|right is the physical side of the MOS strip
[mos]
side_menu = "right"
side_menu_width = "8mm"
reverse_months_quarters = true
menu_rotate = "270deg"
column_gutter = "1.5mm"
row_gutter = "1.5mm"

[section.cover]
title = "2026"
font_size = "36pt"

[section.annual]
show_month_name = true
row_gutter = "4pt"

[section.quarterly]
months_column = "right"
show_month_name = true

[section.monthly]
week_placement = "right"
week_label_rotation = "90deg"
daily_cell_height = "16mm"

[section.weekly]
column_gutter = "4pt"

[section.daily]
# column tracks are left-to-right, so notes stay 5fr and schedule stays 3fr
columns = ["5fr", "3fr"]
item_spacing = "4mm"

[section.daily.left.priorities]
count = 5

[section.daily.left.notes]
pattern = "dotted"
title_height = "4mm"

[section.daily.right.schedule]
hour_from = 8
hour_to = 20
time_format = "%k"
trailing_half_hour = true

[section.daily.right.little_calendar]
week_placement = "right"
inset = "3pt"

[section.daily_notes]
pages = 2
pattern = "dotted"

[section.projects]
pages = 16
card_rows = 5

[section.habits]
habit_columns = 4

[section.meetings]
index_pages = 1
