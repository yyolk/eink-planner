# 158×210
# Original LYP gist MOS (Months on the Side) layout at 158 × 210 mm
# MOS strip side is mos.side_menu (default left). Override with --hand.

sections = [
  "cover",
  "index",
  "annual",
  "quarterly",
  "monthly",
  "weekly",
  "daily",
  "daily_notes",
  "colophon",
]

[device]
name = "158x210"
ppi = 300

[calendar]
year = 2026
week_starts = "Monday"

[style.stroke]
regular = "0.4pt"
thick = "0.8pt"

[style.type]
body = "10pt"
h1 = "10mm"

[style.gutter]
column = "10pt"

# [mos] → Months on the Side (vertical side menu navigation)
# side_menu left|right is the physical side of the MOS strip
[mos]
side_menu = "left"
side_menu_width = "10mm"
reverse_months_quarters = true
menu_rotate = "270deg"
column_gutter = "2mm"
row_gutter = "2mm"

[section.cover]
title = "2026"
font_size = "48pt"

[section.annual]
show_month_name = true
row_gutter = "5pt"

[section.quarterly]
show_month_name = true

[section.monthly]
week_label_rotation = "90deg"
daily_cell_height = "2.5cm"

[section.weekly]
column_gutter = "5pt"

[section.daily]
item_spacing = "5mm"

[section.daily.left.schedule]
hour_from = 8
hour_to = 20
time_format = "%k"
trailing_half_hour = true

[section.daily.left.little_calendar]
inset = "5pt"

[section.daily.right.priorities]
count = 5

[section.daily.right.notes]
pattern = "dotted"
title_height = "5mm"

[section.daily_notes]
pages = 2
pattern = "dotted"
